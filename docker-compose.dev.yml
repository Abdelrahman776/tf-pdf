services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trueform
      POSTGRES_USER: trueform
      POSTGRES_PASSWORD: trueform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SUPABASE_DB_URL: postgresql://trueform:trueform@postgres:5432/trueform
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8010:8010"
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=info",
      ]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SUPABASE_DB_URL: postgresql://trueform:trueform@postgres:5432/trueform
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
